    <main class="shell" style="padding-top:28px;">
    <!-- Banner por categoría — copy fijo (Alumnos/Profesores) resuelto en
         renderCategoriaBanner. .categoria-banner-art no tiene fondo propio
         (a diferencia de .wf-sidebar-promo-art): sin background-image
         puesto queda invisible a propósito, no un hueco con color de
         relleno — el diseño pedido es "se ve la ilustración libre", no
         "una caja esperando imagen". -->
    <div class="wf-panel categoria-banner" id="categoriaBanner">
      <div class="categoria-banner-body">
        <h1 id="categoriaTitle">Cargando…</h1>
        <p id="categoriaBannerDesc"></p>
      </div>
      <div class="categoria-banner-art" id="categoriaBannerArt" aria-hidden="true"></div>
    </div>

    <!-- Invitación cruzada a la otra categoría — toast flotante, no un
         panel fijo en el flujo (ver renderCrosslink). role="status": es
         informativo/promocional, no una alerta que deba interrumpir. -->
    <div class="wf-panel categoria-crosslink" id="crosslinkBanner" role="status" hidden>
      <div class="categoria-crosslink-text" id="crosslinkText"></div>
      <a class="btn btn-primary btn-small" id="crosslinkGoBtn">Ver cursos <i class="ph ph-arrow-right"></i></a>
      <button type="button" class="crosslink-close" id="crosslinkCloseBtn" aria-label="Cerrar aviso">
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
    </div>

    <div class="page-header" style="padding-top:16px;">
      <p id="categoriaSummary"><i class="ph ph-books categoria-summary-icon" aria-hidden="true"></i>Cualquier alumno o profesor puede tomar cualquiera de estos cursos.</p>
    </div>

    <div id="courseSections">
      <div class="empty-state">Cargando cursos...</div>
    </div>

  <script src="assets/api.js"></script>
  <script>
    AcademyAuth.requireAuth();

    const user = AcademyAuth.getUser();
    AcademyAuth.renderNotifMenu(document.getElementById('notifMenu'));
    AcademyAuth.renderUserMenu(document.getElementById('userMenu'));
    AcademyAuth.renderSidebarPromo(document.getElementById('sidebarPromo'));
    AcademyAuth.aplicarGateSidebar();

    const sectionsEl = document.getElementById('courseSections');
    const titleEl = document.getElementById('categoriaTitle');
    const crosslinkBanner = document.getElementById('crosslinkBanner');
    const crosslinkText = document.getElementById('crosslinkText');
    const crosslinkGoBtn = document.getElementById('crosslinkGoBtn');
    const crosslinkCloseBtn = document.getElementById('crosslinkCloseBtn');

    // sessionStorage (no localStorage): la invitación cruzada es un
    // recordatorio de descubrimiento, no una preferencia permanente — vale
    // la pena que vuelva a aparecer en una sesión nueva, pero no debe
    // insistir dentro de la misma. Clave por slug de DESTINO (a dónde
    // invita, no la categoría actual): cerrar "¿vas a Profesores?" no debe
    // silenciar también "¿vas a Alumnos?" si el usuario navega entre
    // ambas categorías en la misma sesión.
    function crosslinkCerrado(destinoSlug) {
      return sessionStorage.getItem(`academy_crosslink_cerrado_${destinoSlug}`) === '1';
    }
    // Timeout de la transición de salida — guardado en módulo para poder
    // cancelarlo. Sin esto, clickear "Ver cursos" dispara ocultarCrosslink()
    // Y un hashchange casi inmediato (navega a la otra categoría), que
    // vuelve a llamar renderCrosslink() para el crosslink OPUESTO (el que
    // no estaba cerrado) mientras el hidden diferido de la vez anterior
    // seguía pendiente — dos operaciones async sobre el mismo nodo podían
    // pisarse y dejarlo oculto pese a acabar de mostrarse.
    let crosslinkHideTimeout = null;

    function ocultarCrosslink(destinoSlug) {
      if (destinoSlug) sessionStorage.setItem(`academy_crosslink_cerrado_${destinoSlug}`, '1');
      clearTimeout(crosslinkHideTimeout);
      crosslinkBanner.classList.remove('is-visible');
      // hidden después de la transición de salida (ver CSS), no de
      // inmediato — si se oculta ya, la animación de cierre no se alcanza
      // a ver.
      crosslinkHideTimeout = setTimeout(() => crosslinkBanner.setAttribute('hidden', ''), 220);
    }
    crosslinkCloseBtn.addEventListener('click', () => ocultarCrosslink(crosslinkBanner.dataset.destino));
    crosslinkGoBtn.addEventListener('click', () => ocultarCrosslink(crosslinkBanner.dataset.destino));

    function renderCrosslink(categoria, categorias) {
      const otra = categorias.find(c => c.slug !== categoria.slug);
      clearTimeout(crosslinkHideTimeout);
      if (!otra || crosslinkCerrado(otra.slug)) { crosslinkBanner.setAttribute('hidden', ''); return; }

      crosslinkBanner.dataset.destino = otra.slug;
      crosslinkGoBtn.href = `categoria.html#slug=${encodeURIComponent(otra.slug)}`;
      // hidden se quita ANTES de escribir el texto, no después: role="status"
      // es una región live, y un lector de pantalla anuncia mutaciones de
      // contenido dentro de una región que YA está visible — si el texto se
      // escribe mientras sigue hidden, el anuncio queda librado a que el
      // propio toggle de hidden re-dispare la lectura del subárbol (funciona
      // en la práctica en los navegadores más comunes, pero no es el
      // comportamiento garantizado por spec).
      crosslinkBanner.removeAttribute('hidden');
      crosslinkText.innerHTML = `¿Buscas algo distinto? También tenemos <strong>${otra.titulo}</strong>.`;
      // Entra en el próximo frame, no en el mismo — el toggle de la clase
      // necesita un estado inicial ya pintado (hidden recién quitado) para
      // que la transición de opacity/transform en CSS se dispare, en vez
      // de arrancar directo en el estado final sin animación visible.
      requestAnimationFrame(() => crosslinkBanner.classList.add('is-visible'));
    }

    // Agrupa los cursos de la categoría actual por tema, preservando el
    // orden que manda el backend en `temas`. Cursos sin tema conocido
    // (defensivo, no debería pasar con el catálogo actual) caen en un
    // grupo final "Otros" para no perderlos silenciosamente.
    function agruparPorTema(cursos, temas) {
      const grupos = temas.map(t => ({ tema: t, cursos: cursos.filter(c => c.tema === t.slug) }))
        .filter(g => g.cursos.length);

      const sinTema = cursos.filter(c => !temas.some(t => t.slug === c.tema));
      if (sinTema.length) {
        grupos.push({ tema: { slug: '_otros', titulo: 'Otros' }, cursos: sinTema });
      }
      return grupos;
    }

    // Misma fórmula que calcularProgreso en index.html — maxSlideIndex es
    // 0-based, "completadas" (texto) es 1-based ("3/7 secciones", no
    // "índice 2 de 7"). Duplicada acá a propósito: categoria.html no
    // carga el script de index.html, y es una fórmula de 2 líneas, no
    // vale la pena un archivo compartido nuevo por esto.
    function calcularProgreso(totalSlides, maxSlideIndex) {
      const idx = Math.min(maxSlideIndex ?? -1, totalSlides - 1);
      const completadas = Math.max(idx + 1, 0);
      const porcentaje = totalSlides > 1 ? (Math.max(idx, 0) / (totalSlides - 1)) * 100 : (completadas > 0 ? 100 : 0);
      return { completadas, porcentaje };
    }

    // Un curso sin diapositivas se marca ANTES de entrar: hasta ahora su
    // tarjeta decía "Entrar al curso" igual que la de un curso real, y el
    // usuario descubría que estaba vacío recién adentro.
    function renderCourseCard(c, avance, cursosCompletadosSet) {
      const sinContenido = !(c.slides || []).length && !c.slidesEmbedUrl;
      // imagenCard es opcional en el catálogo (mismo campo ya usado en el
      // hero de Overview, ver renderHeroCard en index.html). Un curso sin
      // imagen sigue mostrando la tarjeta de solo texto de siempre, sin
      // franja. imagenCardPosicionAmplia es un valor aparte de
      // imagenCardPosicion. Esta franja (.course-card-image, 16:9) es
      // mucho más ancha/baja que el contenedor casi cuadrado del hero, el
      // mismo % de recorte no sirve para ambos (ver el campo en el
      // catálogo). Cae a imagenCardPosicion si no se declara.
      const posicionY = typeof c.imagenCardPosicionAmplia === 'number'
        ? c.imagenCardPosicionAmplia
        : (typeof c.imagenCardPosicion === 'number' ? c.imagenCardPosicion : 0);
      // imagenCardAjuste: 'cover' (default, llena el marco recortando) o
      // 'contain' (muestra la foto completa, sin recorte, a costa de dejar
      // franjas vacías a los lados si la proporción no calza exacto,
      // como fotos de retrato vertical en este marco 16:9 horizontal).
      const ajuste = c.imagenCardAjuste === 'contain' ? 'contain' : 'cover';
      const imagenHtml = c.imagenCard
        ? `<div class="course-card-image" style="background-image:url('${c.imagenCard}');background-position:center ${posicionY}%;background-size:${ajuste}"></div>`
        : '';

      // Progreso real — solo para cursos con contenido y con al menos una
      // diapositiva vista (maxSlideIndex existe en `avance`). Completado
      // usa cursosCompletadosSet (calculado server-side en
      // GET /academy/me/progreso-resumen, mismo criterio que el logro
      // curso-terminado) en vez de recalcular acá "última diapositiva +
      // quiz aprobado" — evita que este archivo y el backend diverjan.
      const totalSlides = (c.slides || []).length;
      const completado = cursosCompletadosSet.has(c.slug);
      const maxSlideIndex = avance[c.slug];
      const empezado = !sinContenido && !completado && typeof maxSlideIndex === 'number';
      const progreso = empezado ? calcularProgreso(totalSlides, maxSlideIndex) : null;
      let progresoHtml = '';
      if (completado) {
        progresoHtml = `<div class="course-card-progress-label"><i class="ph ph-check-circle" aria-hidden="true"></i> Completado</div>`;
      } else if (progreso) {
        progresoHtml = `
          <div class="course-card-progress-label">${progreso.completadas} / ${totalSlides} secciones completadas</div>
          <div class="course-card-progress-bar"><span style="width:${progreso.porcentaje}%"></span></div>
        `;
      }

      // aria-label resume toda la tarjeta en una sola frase — sin esto,
      // un lector de pantalla anuncia el <a> leyendo TODO su contenido de
      // texto interno de corrido (título + descripción + "Completado" del
      // label de progreso + el ícono con texto oculto que también se lee
      // + el texto del botón), repitiendo el estado dos veces. Con el
      // label puesto, el resto del contenido interno se marca
      // aria-hidden para que no se lea por partida doble.
      const estadoLabel = completado
        ? 'Completado'
        : progreso
          ? `${progreso.completadas} de ${totalSlides} secciones completadas`
          : sinContenido ? 'Próximamente' : 'Sin empezar';
      const accionLabel = sinContenido ? '' : `, ${empezado ? 'continuar' : 'entrar al curso'}`;
      const cardLabel = `${c.titulo}. ${c.descripcion || ''} ${estadoLabel}${accionLabel}.`;

      return `
        <a class="course-card${sinContenido ? ' is-empty-course' : ''}${completado ? ' is-completed' : ''}" href="curso.html#slug=${encodeURIComponent(c.slug)}" aria-label="${escapeHtml(cardLabel)}">
          ${imagenHtml}
          <div class="course-card-body" aria-hidden="true">
            <h2>${c.titulo}${completado ? '<i class="ph ph-check-circle course-card-check"></i>' : ''}</h2>
            <p>${c.descripcion || ''}</p>
            ${progresoHtml}
            ${sinContenido
              ? '<span class="course-card-soon"><i class="ph ph-hourglass-medium"></i> Próximamente</span>'
              : `<span class="btn btn-primary">${empezado ? 'Continuar' : 'Entrar al curso'}</span>`}
          </div>
        </a>
      `;
    }

    function renderGrupos(grupos, avance, cursosCompletadosSet) {
      sectionsEl.innerHTML = grupos.map(g => `
        <div class="tema-section">
          <div class="wf-section-title">${g.tema.titulo}</div>
          <div class="course-grid">
            ${g.cursos.map(c => renderCourseCard(c, avance, cursosCompletadosSet)).join('')}
          </div>
        </div>
      `).join('');
    }

    // Sin #slug= explícito: usa la categoría preferida del usuario
    // (categoriaPreferida, elegida en el registro, puramente clasificatorio,
    // NO es user.rol). Con #slug= explícito (p. ej. viniendo de una tarjeta
    // de "Todos los cursos" en index.html, o del crosslink de esta misma
    // página), se respeta tal cual. Va en el hash (#slug=X), no en el
    // query string (?slug=X): el hash nunca se envía al servidor, así que
    // ningún servidor estático con "clean URLs" (ej. npx serve en
    // desarrollo local) puede perderlo en un redirect, a diferencia del
    // query string, que sí se pierde ahí.
    //
    // Se recalcula en CADA llamada (no una constante de módulo): el
    // crosslink de esta misma página cambia solo el hash sin recargar
    // (ver listener de hashchange más abajo) — si categoriaSlug quedara
    // fijo en el valor de la primera carga, un segundo click al crosslink
    // actualizaría la URL visible pero nunca el contenido renderizado.
    function categoriaSlugActual() {
      const params = new URLSearchParams(window.location.hash.slice(1));
      return params.get('slug') || user.categoriaPreferida || 'alumnos';
    }

    // Resumen real arriba de la grilla — cuántos cursos CON contenido tiene
    // esta categoría y cuántos ya completó, contra el subtítulo genérico
    // fijo de antes. Cuenta solo sobre `cursos` (ya filtrados a la
    // categoría actual), no sobre el total global de cursosCompletadosSet
    // (que puede incluir cursos de la otra categoría).
    function renderCategoriaSummary(cursos, cursosCompletadosSet) {
      const conContenido = cursos.filter(c => (c.slides || []).length || c.slidesEmbedUrl);
      const completados = conContenido.filter(c => cursosCompletadosSet.has(c.slug)).length;
      const el = document.getElementById('categoriaSummary');
      const plural = conContenido.length === 1 ? 'curso disponible' : 'cursos disponibles';
      const sufijoCompletados = completados > 0
        ? `, ${completados} completado${completados === 1 ? '' : 's'}`
        : '';
      el.innerHTML = `<i class="ph ph-books categoria-summary-icon" aria-hidden="true"></i>${conContenido.length} ${plural}${sufijoCompletados}`;
    }

    // Copy fijo por categoría — a diferencia de categoria.titulo (viene del
    // backend, solo el nombre corto "Alumnos"/"Profesores"), esta
    // descripción es contenido editorial que no tiene sentido pedirle al
    // catálogo de cursos. imagen: null (alumnos) dibuja el hueco sin
    // background-image — invisible hasta que se suba, no un placeholder
    // con color de relleno (ver .categoria-banner-art en styles.css).
    const CATEGORIA_BANNER_COPY = {
      alumnos: {
        descripcion: 'Domina el uso de Pharis como tu tutor de IA para estudiar mejor. Esta sección reúne una selección de cursos pensados para ayudarte a sacarle el máximo provecho, desde cómo hacer las preguntas correctas hasta prepararte para tus exámenes.',
        imagen: null,
      },
      profesores: {
        descripcion: 'Domina el uso de Pharis como tu asistente de IA para enseñar mejor. Esta sección reúne una selección de cursos pensados para ayudarte a integrar la IA en tu salón de clases, desde el diseño de actividades hasta el seguimiento del progreso de tus alumnos.',
        imagen: 'https://pub-8dbbde7f94954173b9eaa1e10f3a0aa0.r2.dev/assets/Foto%20-%20Top%20Curso%20Maestros.png',
      },
    };

    function renderCategoriaBanner(categoriaSlug) {
      // display:'' (no 'flex') restaura el valor por defecto de la hoja de
      // estilos en vez de fijar uno hardcodeado acá — se ejecuta en CADA
      // loadCategoria(), así que también deshace el display:'none' que los
      // caminos de error más abajo puedan haber dejado en una carga previa
      // (ej. tras un hashchange a una categoría inválida y luego a una
      // válida, sin recargar la página).
      document.getElementById('categoriaBanner').style.display = '';
      const copy = CATEGORIA_BANNER_COPY[categoriaSlug] || CATEGORIA_BANNER_COPY.alumnos;
      document.getElementById('categoriaBannerDesc').textContent = copy.descripcion;
      document.getElementById('categoriaBannerArt').style.backgroundImage =
        copy.imagen ? `url('${copy.imagen}')` : '';
    }

    // Token de turno — hashchange puede disparar loadCategoria() de nuevo
    // (ej. click en "Ver cursos" del crosslink, o en el crosslink banner de
    // arriba) mientras el fetch anterior sigue en vuelo. Sin esto, dos
    // invocaciones concurrentes de loadCategoria() pueden resolver fuera de
    // orden y la respuesta más VIEJA terminaría pisando el DOM (incluido el
    // crosslink) después de que la más NUEVA ya renderizó. Cada invocación
    // se descarta a sí misma si, al resolver su await, ya no es la última
    // en haber arrancado.
    let loadCategoriaTurno = 0;

    async function loadCategoria() {
      const categoriaSlug = categoriaSlugActual();
      const miTurno = ++loadCategoriaTurno;
      renderCategoriaBanner(categoriaSlug);
      try {
        // avance y progreso-resumen no bloquean la grilla si fallan — el
        // catch vacío degrada a "sin progreso mostrado", mismo criterio
        // que el resto de fetches secundarios de Academy (ver
        // loadCursosGuardados en progreso.html).
        const [data, avance, resumen] = await Promise.all([
          academyFetch('/academy/courses'),
          academyFetch('/academy/me/avance').catch(() => ({})),
          academyFetch('/academy/me/progreso-resumen').catch(() => ({ cursosCompletadosSlugs: [] })),
        ]);
        if (miTurno !== loadCategoriaTurno) return; // una invocación más nueva ya arrancó, no pisar su resultado
        const categorias = data.categorias || [];
        const temas = data.temas || [];
        const cursosCompletadosSet = new Set(resumen.cursosCompletadosSlugs || []);

        const categoria = categorias.find(c => c.slug === categoriaSlug);
        if (!categoria) {
          titleEl.textContent = 'Categoría no encontrada';
          document.getElementById('breadcrumbCurrent').textContent = 'Categoría no encontrada';
          document.getElementById('categoriaBanner').style.display = 'none';
          sectionsEl.innerHTML = '';
          clearTimeout(crosslinkHideTimeout);
          crosslinkBanner.classList.remove('is-visible');
          crosslinkBanner.setAttribute('hidden', '');
          return;
        }
        titleEl.textContent = categoria.titulo;
        document.getElementById('breadcrumbCurrent').textContent = categoria.titulo;
        renderCrosslink(categoria, categorias);

        const cursos = data.courses.filter(c => c.categoria === categoriaSlug);
        if (!cursos.length) {
          sectionsEl.innerHTML = '<div class="empty-state">No hay cursos en esta categoría todavía.</div>';
          return;
        }

        renderCategoriaSummary(cursos, cursosCompletadosSet);
        renderGrupos(agruparPorTema(cursos, temas), avance, cursosCompletadosSet);
      } catch (err) {
        if (miTurno !== loadCategoriaTurno) return; // ídem — un turno más nuevo ya está a cargo del DOM
        titleEl.textContent = 'Error al cargar';
        document.getElementById('categoriaBanner').style.display = 'none';
        sectionsEl.innerHTML = `<div class="empty-state">${err.message}</div>`;
        clearTimeout(crosslinkHideTimeout);
        crosslinkBanner.classList.remove('is-visible');
        crosslinkBanner.setAttribute('hidden', '');
      }
    }

    loadCategoria();
    // El crosslink de esta misma página solo cambia el hash (misma URL de
    // documento), así que el navegador no dispara una carga nueva —
    // sin este listener, un click ahí actualizaba la barra de direcciones
    // pero el contenido renderizado se quedaba en la categoría vieja.
    window.addEventListener('hashchange', loadCategoria);
  </script>
</body>
