      </div>
      <h1>Inicia sesión</h1>
      <!-- login.html es la landing de facto (requireAuth redirige acá sin
           sesión) y no decía qué es el producto: quien llegaba sin conocerlo
           solo veía dos campos y un botón. -->
      <p class="subtitle">Aprende a usar Pharis, tu tutor de IA, con cursos cortos y práctica real.</p>

      <div class="error-box" id="errorBox" aria-live="polite"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Correo</label>
          <input type="email" id="email" required autocomplete="email" spellcheck="false" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">
          <i class="ph ph-circle-notch btn-spinner" aria-hidden="true"></i>
          <span id="submitBtnLabel">Entrar</span>
        </button>
      </form>

      <div class="auth-switch">
        ¿No tienes cuenta? <a href="register.html">Regístrate</a>
      </div>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script>
    AcademyAuth.redirectIfLoggedIn();

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');
    const submitBtnLabel = document.getElementById('submitBtnLabel');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.classList.add('is-loading');
      submitBtnLabel.textContent = 'Entrando…';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const data = await academyFetch('/academy/login', {
          method: 'POST',
          body: JSON.stringify({ email, password }),
        });
        AcademyAuth.setSession(data.token, data.user);
        sessionStorage.setItem('academy_just_authenticated', '1');
        window.location.href = 'index.html';
      } catch (err) {
        showError(err.message);
        submitBtn.disabled = false;
        submitBtn.classList.remove('is-loading');
        submitBtnLabel.textContent = 'Entrar';
      }
    });
  </script>
