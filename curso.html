      </a>
      <div class="topbar-actions">
        <div id="userMenu"></div>

  <main class="shell">
    <div class="page-header">
      <h1 id="courseTitle">Cargando curso...</h1>
      <p id="courseDesc"></p>
    </div>

    <section class="course-section">
      <h2>Presentación</h2>
      <div class="embed-frame" id="embedFrame">Las diapositivas se agregarán próximamente.</div>
    </section>

    <section class="course-section">
      <h2>Subir actividad</h2>
      <p>Sube tu actividad en PDF o imagen (JPG/PNG). Pharis la revisará automáticamente contra la rúbrica del curso.</p>

      <div class="upload-box">
        <input type="file" id="fileInput" accept="application/pdf,image/png,image/jpeg" />
        <button class="btn btn-primary" id="uploadBtn">Subir actividad</button>
        <div class="upload-status" id="uploadStatus"></div>
      </div>

      <div class="submission-history" id="submissionHistory"></div>
    </section>
  </main>

  <script src="assets/api.js"></script>
  <script>
    AcademyAuth.requireAuth();

    const user = AcademyAuth.getUser();
    AcademyAuth.renderUserMenu(document.getElementById('userMenu'));

    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    if (!slug) window.location.href = 'index.html';

    // Historial local de esta sesión de navegador — el backend no expone
    // GET /academy/mis-entregas (fuera de alcance de esta primera versión),
    // así que solo se listan las entregas hechas en esta pestaña/sesión.
    const localHistory = [];

    async function loadCourse() {
      try {
        const data = await academyFetch('/academy/courses');
        const course = data.courses.find(c => c.slug === slug);
        if (!course) {
          document.getElementById('courseTitle').textContent = 'Curso no encontrado';
          return;
        }
        document.getElementById('courseTitle').textContent = course.titulo;
        document.getElementById('courseDesc').textContent = course.descripcion || '';

        const embedFrame = document.getElementById('embedFrame');
        if (course.slidesEmbedUrl) {
          embedFrame.innerHTML = `<iframe src="${course.slidesEmbedUrl}" allowfullscreen></iframe>`;
        }
      } catch (err) {
        document.getElementById('courseTitle').textContent = 'Error al cargar el curso';
        document.getElementById('courseDesc').textContent = err.message;
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function badgeFor(calificacion) {
      if (calificacion === 'Completado') return '<span class="badge badge-completado">Completado</span>';
      if (calificacion === 'Necesita mejoras') return '<span class="badge badge-mejoras">Necesita mejoras</span>';
      if (calificacion === 'Incompleto') return '<span class="badge badge-incompleto">Incompleto</span>';
      return '<span class="badge badge-pendiente">Pendiente</span>';
    }

    function renderHistory() {
      const el = document.getElementById('submissionHistory');
      if (!localHistory.length) { el.innerHTML = ''; return; }
      el.innerHTML = localHistory.map(s => `
        <div class="submission-item">
          <div>
            <div class="name">${s.archivo_nombre || 'Actividad'}</div>
            <div class="date">${new Date(s.created_at).toLocaleString('es-MX')}</div>
            ${s.feedback_claude ? `<div class="date" style="margin-top:4px;">${s.feedback_claude}</div>` : ''}
          </div>
          ${badgeFor(s.calificacion)}
        </div>
      `).join('');
    }

    const MAX_FILE_BYTES = 10 * 1024 * 1024;
    const uploadBtn = document.getElementById('uploadBtn');
    const statusBox = document.getElementById('uploadStatus');

    function showStatus(kind, msg) {
      statusBox.className = `upload-status visible ${kind}`;
      statusBox.textContent = msg;
    }

    uploadBtn.addEventListener('click', async () => {
      const file = document.getElementById('fileInput').files[0];
      if (!file) { showStatus('warn', 'Selecciona un archivo primero.'); return; }
      if (file.size > MAX_FILE_BYTES) { showStatus('err', 'El archivo supera el límite de 10MB.'); return; }

      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Evaluando con Pharis...';
      showStatus('warn', 'Subiendo y evaluando tu actividad, puede tardar unos segundos...');

      try {
        const dataUrl = await fileToBase64(file);
        const esImagen = file.type.startsWith('image/');

        const result = await academyFetch('/academy/submit', {
          method: 'POST',
          body: JSON.stringify({
            curso: slug,
            archivoBase64: dataUrl,
            archivoNombre: file.name,
            esImagen,
          }),
        });

        const sub = result.submission;
        localHistory.unshift(sub);
        renderHistory();

        if (sub.calificacion) {
          showStatus('ok', `Evaluación: ${sub.calificacion}. ${sub.feedback_claude || ''}`);
        } else {
          showStatus('warn', sub.feedback_claude || 'Tu actividad se guardó. Un profesor la revisará.');
        }
        document.getElementById('fileInput').value = '';
      } catch (err) {
        showStatus('err', err.message);
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Subir actividad';
      }
    });

    loadCourse();
  </script>
