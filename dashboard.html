    <!-- Card motivacional — el div .wf-sidebar-promo-art es el hueco
         reservado para la ilustración, sin contenido propio. Texto propio
         para este rol (a diferencia de las demás páginas, acá el usuario
         siempre es profesor). -->
    <div class="wf-sidebar-promo">
      <div class="wf-sidebar-promo-art"></div>
      <div class="wf-sidebar-promo-text">Cada duda que resuelves con Pharis es una clase que ya no tienes que repetir.</div>
      <div class="wf-sidebar-promo-sub">Enseñar con IA, sin perder el control</div>
    </div>

  <div class="wf-main">
    <div class="wf-topbar">
      <h1>Dashboard</h1>
      <div class="topbar-actions">
        <div id="notifMenu"></div>
        <div id="userMenu"></div>
      </div>
    </div>

    <main class="shell" style="padding-top:28px;">
      <div class="dash-toolbar" style="padding-top:0;">
        <p style="margin:0;">Actividad de todos los alumnos registrados</p>
        <button class="btn btn-secondary" style="width:auto; padding:10px 18px;" id="exportBtn">Exportar CSV</button>
      </div>

      <div class="dash-stats" id="statsRow"></div>

      <div id="dashContent">
        <div class="empty-state">Cargando dashboard...</div>
      </div>
    </main>
  </div>

  <script src="assets/api.js"></script>
  <script>
    AcademyAuth.requireAuth();
    const user = AcademyAuth.getUser();
    AcademyAuth.renderNotifMenu(document.getElementById('notifMenu'));
    AcademyAuth.renderUserMenu(document.getElementById('userMenu'));
    // El link de Dashboard se revela ANTES del gate: aplicarGateSidebar()
    // termina construyendo el nav móvil clonando los links visibles, así
    // que un profesor se quedaría sin Dashboard ahí si se revelara después.
    if (user.rol === 'profesor') {
      document.getElementById('navDashboard').style.display = 'flex';
    }
    AcademyAuth.aplicarGateSidebar();

    if (user.rol !== 'profesor') {
      document.getElementById('dashContent').innerHTML =
        '<div class="empty-state">Esta sección es solo para profesores.</div>';
      document.getElementById('exportBtn').style.display = 'none';
    }

    let entregasCache = [];

    function badgeFor(calificacion) {
      if (calificacion === 'Completado') return '<span class="badge badge-completado">Completado</span>';
      if (calificacion === 'Necesita mejoras') return '<span class="badge badge-mejoras">Necesita mejoras</span>';
      if (calificacion === 'Incompleto') return '<span class="badge badge-incompleto">Incompleto</span>';
      return '<span class="badge badge-pendiente">Pendiente</span>';
    }

    function renderStats(usuarios, entregas) {
      const completadas = entregas.filter(e => e.calificacion === 'Completado').length;
      const mejoras = entregas.filter(e => e.calificacion === 'Necesita mejoras').length;
      const incompletas = entregas.filter(e => e.calificacion === 'Incompleto').length;

      document.getElementById('statsRow').innerHTML = `
        <div class="stat-tile"><div class="label">Usuarios registrados</div><div class="value">${usuarios.length}</div></div>
        <div class="stat-tile"><div class="label">Entregas totales</div><div class="value">${entregas.length}</div></div>
        <div class="stat-tile"><div class="label">Completadas</div><div class="value">${completadas}</div></div>
        <div class="stat-tile"><div class="label">Necesitan mejoras</div><div class="value">${mejoras}</div></div>
        <div class="stat-tile"><div class="label">Incompletas</div><div class="value">${incompletas}</div></div>
      `;
    }

    function renderTables(usuarios, entregas) {
      const entregasPorUsuario = {};
      for (const e of entregas) {
        (entregasPorUsuario[e.user_id] = entregasPorUsuario[e.user_id] || []).push(e);
      }

      const usuariosRows = usuarios.map(u => {
        const propias = entregasPorUsuario[u.id] || [];
        const estado = propias.length
          ? badgeFor(propias[0].calificacion)
          : '<span class="badge badge-pendiente">Sin entregas</span>';
        return `
          <tr>
            <td>${u.nombre}</td>
            <td>${u.email}</td>
            <td>${u.rol}</td>
            <td>${propias.length}</td>
            <td>${estado}</td>
          </tr>
        `;
      }).join('');

      const entregasRows = entregas.map(e => `
        <tr>
          <td>${e.user_nombre}<br><span style="color:var(--text-faint); font-size:0.78rem;">${e.user_email}</span></td>
          <td>${e.curso}</td>
          <td>${badgeFor(e.calificacion)}</td>
          <td class="feedback-cell">${e.feedback_claude || ''}</td>
          <td>${new Date(e.created_at).toLocaleString('es-MX')}</td>
        </tr>
      `).join('');

      document.getElementById('dashContent').innerHTML = `
        <h2 style="font-size:1.1rem; margin-bottom:12px;">Usuarios</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Entregas</th><th>Última entrega</th></tr></thead>
            <tbody>${usuariosRows || '<tr><td colspan="5" class="empty-state">Sin usuarios todavía.</td></tr>'}</tbody>
          </table>
        </div>

        <h2 style="font-size:1.1rem; margin-bottom:12px;">Entregas</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Alumno</th><th>Curso</th><th>Calificación</th><th>Feedback</th><th>Fecha</th></tr></thead>
            <tbody>${entregasRows || '<tr><td colspan="5" class="empty-state">Sin entregas todavía.</td></tr>'}</tbody>
          </table>
        </div>
      `;
    }

    function toCsvField(value) {
      const str = String(value ?? '');
      return /[",\n]/.test(str) ? `"${str.replace(/"/g, '""')}"` : str;
    }

    function exportCsv() {
      const header = ['alumno', 'correo', 'curso', 'calificacion', 'feedback', 'fecha'];
      const rows = entregasCache.map(e => [
        e.user_nombre, e.user_email, e.curso, e.calificacion || 'Pendiente', e.feedback_claude || '', e.created_at,
      ]);
      const csv = [header, ...rows].map(r => r.map(toCsvField).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `pharis-academy-entregas-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function loadDashboard() {
      if (user.rol !== 'profesor') return;
      try {
        const data = await academyFetch('/academy/dashboard');
        entregasCache = data.entregas;
        renderStats(data.usuarios, data.entregas);
        renderTables(data.usuarios, data.entregas);
      } catch (err) {
        document.getElementById('dashContent').innerHTML = `<div class="empty-state">${err.message}</div>`;
      }
    }

    document.getElementById('exportBtn').addEventListener('click', exportCsv);
    loadDashboard();
  </script>
</body>
